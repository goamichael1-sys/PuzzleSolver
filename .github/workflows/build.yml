name: Build APKs
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build both apps
        run: gradle assemblePenguinDebug assembleHoleDebug --no-daemon
      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/penguin/debug/app-penguin-debug.apk out/PenguinSolver.apk
          cp app/build/outputs/apk/hole/debug/app-hole-debug.apk out/HoleBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
      - name: Publish as "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/PenguinSolver.apk out/HoleBot.apk \
            --title "Latest APKs" --notes "PenguinSolver.apk = grid puzzle, HoleBot.apk = hole game"
